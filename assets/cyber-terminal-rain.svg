<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020409" />
      <stop offset="50%" stop-color="#060b17" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="neon-c" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00BBF9" />
    </linearGradient>
    <linearGradient id="neon-p" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#9D4EDD" />
    </linearGradient>
    <linearGradient id="radar-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0" />
    </linearGradient>

    <!-- CRT Scanlines -->
    <pattern id="crt-lines" width="100" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00F5D4" stroke-opacity="0.04" stroke-width="1" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="bloom-head" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="bloom-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip Path for Rain -->
    <clipPath id="rain-window">
      <rect x="15" y="32" width="480" height="195" rx="3" />
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'Consolas', 'Courier New', Courier, monospace; }

    /* Matrix Rain Keyframes & Classes */
    .head-char { fill: #FFFFFF; font-weight: bold; filter: url(#bloom-head); }
    .lead-char { fill: #00F5D4; font-weight: bold; }
    .mid-char  { fill: #00FF66; filter: url(#bloom-green); }
    .dim-char  { fill: #009933; opacity: 0.7; }
    .dark-char { fill: #004411; opacity: 0.35; }

    @keyframes cascade1 { 0% { transform: translateY(-260px); } 100% { transform: translateY(220px); } }
    @keyframes cascade2 { 0% { transform: translateY(-300px); } 100% { transform: translateY(220px); } }
    @keyframes cascade3 { 0% { transform: translateY(-240px); } 100% { transform: translateY(220px); } }
    @keyframes cascade4 { 0% { transform: translateY(-320px); } 100% { transform: translateY(220px); } }

    .c1  { animation: cascade1 2.2s linear infinite; animation-delay: -0.3s; }
    .c2  { animation: cascade2 3.1s linear infinite; animation-delay: -1.7s; }
    .c3  { animation: cascade3 1.8s linear infinite; animation-delay: -0.8s; }
    .c4  { animation: cascade4 2.8s linear infinite; animation-delay: -2.3s; }
    .c5  { animation: cascade1 2.5s linear infinite; animation-delay: -1.2s; }
    .c6  { animation: cascade2 3.4s linear infinite; animation-delay: -0.5s; }
    .c7  { animation: cascade3 1.9s linear infinite; animation-delay: -1.5s; }
    .c8  { animation: cascade4 2.6s linear infinite; animation-delay: -2.9s; }
    .c9  { animation: cascade1 3.0s linear infinite; animation-delay: -0.7s; }
    .c10 { animation: cascade2 2.1s linear infinite; animation-delay: -1.9s; }
    .c11 { animation: cascade3 2.7s linear infinite; animation-delay: -0.2s; }
    .c12 { animation: cascade4 3.3s linear infinite; animation-delay: -2.1s; }
    .c13 { animation: cascade1 2.0s linear infinite; animation-delay: -1.4s; }
    .c14 { animation: cascade2 2.9s linear infinite; animation-delay: -0.9s; }
    .c15 { animation: cascade3 3.5s linear infinite; animation-delay: -2.5s; }
    .c16 { animation: cascade4 2.3s linear infinite; animation-delay: -1.1s; }
    .c17 { animation: cascade1 3.2s linear infinite; animation-delay: -0.4s; }
    .c18 { animation: cascade2 1.7s linear infinite; animation-delay: -1.6s; }
    .c19 { animation: cascade3 2.8s linear infinite; animation-delay: -2.2s; }

    /* Laser CRT Scanner */
    .laser-sweep { animation: lscan 4s linear infinite; }
    @keyframes lscan {
      0%   { transform: translateY(0px); opacity: 0; }
      15%  { opacity: 0.8; }
      85%  { opacity: 0.8; }
      100% { transform: translateY(240px); opacity: 0; }
    }

    /* Holographic Radar Sweep */
    .radar-rot {
      transform-origin: 590px 135px;
      animation: rspin 4s linear infinite;
    }
    @keyframes rspin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Reticle Pulse */
    .reticle-pulse {
      animation: rpulse 2s ease-in-out infinite alternate;
    }
    @keyframes rpulse {
      0%   { opacity: 0.4; transform: scale(0.96); transform-origin: 590px 135px; }
      100% { opacity: 1; transform: scale(1.02); transform-origin: 590px 135px; }
    }

    /* Oscilloscope Waveform Animation */
    .wave-pulse {
      animation: osc 1.5s ease-in-out infinite alternate;
    }
    @keyframes osc {
      0%   { transform: scaleY(0.7); transform-origin: 760px 135px; }
      100% { transform: scaleY(1.3); transform-origin: 760px 135px; }
    }

    /* Status Blinker */
    .blink-fast {
      animation: bfast 1s steps(2, start) infinite;
    }
    @keyframes bfast {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.2; }
    }
  </style>

  <!-- Frame Background -->
  <rect x="2" y="2" width="896" height="236" rx="7" fill="url(#term-bg)" stroke="#1E293B" stroke-width="1.5" />
  <rect x="2" y="2" width="896" height="236" rx="7" fill="url(#crt-lines)" pointer-events="none" />

  <!-- Laser CRT Scanning Beam -->
  <g class="laser-sweep" pointer-events="none">
    <line x1="2" y1="0" x2="898" y2="0" stroke="#00F5D4" stroke-width="1.5" opacity="0.6" />
    <rect x="2" y="-10" width="896" height="10" fill="url(#neon-c)" opacity="0.05" />
  </g>

  <!-- Corner Brackets -->
  <path d="M 2 24 L 2 2 L 24 2" fill="none" stroke="#00F5D4" stroke-width="2.5" />
  <path d="M 898 24 L 898 2 L 876 2" fill="none" stroke="#FF007F" stroke-width="2.5" />
  <path d="M 2 216 L 2 238 L 24 238" fill="none" stroke="#FF007F" stroke-width="2.5" />
  <path d="M 898 216 L 898 238 L 876 238" fill="none" stroke="#00F5D4" stroke-width="2.5" />

  <!-- Top Terminal Header Bar -->
  <rect x="3" y="3" width="894" height="26" rx="5" fill="#060b14" stroke="#1E293B" stroke-width="0.8" />
  <circle cx="20" cy="16" r="4" fill="#FF5F56" />
  <circle cx="34" cy="16" r="4" fill="#FFBD2E" />
  <circle cx="48" cy="16" r="4" fill="#27C93F" />

  <text x="68" y="19" class="mono" font-size="10.5" font-weight="bold" fill="#00F5D4" letter-spacing="1">NETRUNNER_MAINFRAME // CONTINUOUS_CASCADE_0x7F9A</text>
  <text x="880" y="19" text-anchor="end" class="mono" font-size="9" fill="#94A3B8">MODE: AUTONOMOUS_INFILTRATION | FEED: LIVE</text>

  <!-- LEFT PANE: Dense Continuous Matrix Digital Rain -->
  <rect x="15" y="34" width="480" height="192" rx="4" fill="#010307" stroke="#0d1829" stroke-width="1" />
  <text x="25" y="47" class="mono" font-size="8.5" fill="#00F5D4" letter-spacing="1">[DATA_CASCADE // 480x192 DECK]</text>

  <g clip-path="url(#rain-window)" transform="translate(0, 0)">
    <!-- Column 1 -->
    <g class="c1" transform="translate(30, 0)">
      <text x="0" y="0" class="mono dark-char">7</text><text x="0" y="14" class="mono dim-char">F</text><text x="0" y="28" class="mono mid-char">9</text><text x="0" y="42" class="mono mid-char">A</text><text x="0" y="56" class="mono lead-char">0</text><text x="0" y="70" class="mono head-char">X</text>
    </g>
    <!-- Column 2 -->
    <g class="c2" transform="translate(54, 0)">
      <text x="0" y="0" class="mono dark-char">ｱ</text><text x="0" y="14" class="mono dark-char">ｶ</text><text x="0" y="28" class="mono dim-char">ｻ</text><text x="0" y="42" class="mono mid-char">ﾀ</text><text x="0" y="56" class="mono lead-char">ﾅ</text><text x="0" y="70" class="mono head-char">ﾊ</text>
    </g>
    <!-- Column 3 -->
    <g class="c3" transform="translate(78, 0)">
      <text x="0" y="0" class="mono dark-char">C</text><text x="0" y="14" class="mono dim-char">Y</text><text x="0" y="28" class="mono mid-char">B</text><text x="0" y="42" class="mono mid-char">E</text><text x="0" y="56" class="mono lead-char">R</text><text x="0" y="70" class="mono head-char">_</text>
    </g>
    <!-- Column 4 -->
    <g class="c4" transform="translate(102, 0)">
      <text x="0" y="0" class="mono dark-char">1</text><text x="0" y="14" class="mono dark-char">0</text><text x="0" y="28" class="mono dim-char">1</text><text x="0" y="42" class="mono mid-char">1</text><text x="0" y="56" class="mono lead-char">0</text><text x="0" y="70" class="mono head-char">1</text>
    </g>
    <!-- Column 5 -->
    <g class="c5" transform="translate(126, 0)">
      <text x="0" y="0" class="mono dark-char">ﾏ</text><text x="0" y="14" class="mono dim-char">ﾐ</text><text x="0" y="28" class="mono mid-char">ﾑ</text><text x="0" y="42" class="mono mid-char">ﾒ</text><text x="0" y="56" class="mono lead-char">ﾓ</text><text x="0" y="70" class="mono head-char">ﾔ</text>
    </g>
    <!-- Column 6 -->
    <g class="c6" transform="translate(150, 0)">
      <text x="0" y="0" class="mono dark-char">P</text><text x="0" y="14" class="mono dim-char">A</text><text x="0" y="28" class="mono mid-char">R</text><text x="0" y="42" class="mono mid-char">A</text><text x="0" y="56" class="mono lead-char">M</text><text x="0" y="70" class="mono head-char">!</text>
    </g>
    <!-- Column 7 -->
    <g class="c7" transform="translate(174, 0)">
      <text x="0" y="0" class="mono dark-char">0</text><text x="0" y="14" class="mono dim-char">x</text><text x="0" y="28" class="mono mid-char">F</text><text x="0" y="42" class="mono mid-char">F</text><text x="0" y="56" class="mono lead-char">8</text><text x="0" y="70" class="mono head-char">8</text>
    </g>
    <!-- Column 8 -->
    <g class="c8" transform="translate(198, 0)">
      <text x="0" y="0" class="mono dark-char">ﾗ</text><text x="0" y="14" class="mono dim-char">ﾘ</text><text x="0" y="28" class="mono mid-char">ﾙ</text><text x="0" y="42" class="mono mid-char">ﾚ</text><text x="0" y="56" class="mono lead-char">ﾛ</text><text x="0" y="70" class="mono head-char">ﾜ</text>
    </g>
    <!-- Column 9 -->
    <g class="c9" transform="translate(222, 0)">
      <text x="0" y="0" class="mono dark-char">Q</text><text x="0" y="14" class="mono dim-char">_</text><text x="0" y="28" class="mono mid-char">A</text><text x="0" y="42" class="mono mid-char">I</text><text x="0" y="56" class="mono lead-char">2</text><text x="0" y="70" class="mono head-char">0</text>
    </g>
    <!-- Column 10 -->
    <g class="c10" transform="translate(246, 0)">
      <text x="0" y="0" class="mono dark-char">Ψ</text><text x="0" y="14" class="mono dim-char">Ω</text><text x="0" y="28" class="mono mid-char">λ</text><text x="0" y="42" class="mono mid-char">Ξ</text><text x="0" y="56" class="mono lead-char">Σ</text><text x="0" y="70" class="mono head-char">Δ</text>
    </g>
    <!-- Column 11 -->
    <g class="c11" transform="translate(270, 0)">
      <text x="0" y="0" class="mono dark-char">0</text><text x="0" y="14" class="mono dim-char">1</text><text x="0" y="28" class="mono mid-char">1</text><text x="0" y="42" class="mono mid-char">0</text><text x="0" y="56" class="mono lead-char">0</text><text x="0" y="70" class="mono head-char">1</text>
    </g>
    <!-- Column 12 -->
    <g class="c12" transform="translate(294, 0)">
      <text x="0" y="0" class="mono dark-char">S</text><text x="0" y="14" class="mono dim-char">H</text><text x="0" y="28" class="mono mid-char">E</text><text x="0" y="42" class="mono mid-char">L</text><text x="0" y="56" class="mono lead-char">L</text><text x="0" y="70" class="mono head-char">#</text>
    </g>
    <!-- Column 13 -->
    <g class="c13" transform="translate(318, 0)">
      <text x="0" y="0" class="mono dark-char">ｷ</text><text x="0" y="14" class="mono dim-char">ｸ</text><text x="0" y="28" class="mono mid-char">ｹ</text><text x="0" y="42" class="mono mid-char">ｺ</text><text x="0" y="56" class="mono lead-char">ｻ</text><text x="0" y="70" class="mono head-char">ｼ</text>
    </g>
    <!-- Column 14 -->
    <g class="c14" transform="translate(342, 0)">
      <text x="0" y="0" class="mono dark-char">N</text><text x="0" y="14" class="mono dim-char">E</text><text x="0" y="28" class="mono mid-char">U</text><text x="0" y="42" class="mono mid-char">R</text><text x="0" y="56" class="mono lead-char">A</text><text x="0" y="70" class="mono head-char">L</text>
    </g>
    <!-- Column 15 -->
    <g class="c15" transform="translate(366, 0)">
      <text x="0" y="0" class="mono dark-char">ﾃ</text><text x="0" y="14" class="mono dim-char">ﾄ</text><text x="0" y="28" class="mono mid-char">ﾅ</text><text x="0" y="42" class="mono mid-char">ﾆ</text><text x="0" y="56" class="mono lead-char">ﾇ</text><text x="0" y="70" class="mono head-char">ﾈ</text>
    </g>
    <!-- Column 16 -->
    <g class="c16" transform="translate(390, 0)">
      <text x="0" y="0" class="mono dark-char">4</text><text x="0" y="14" class="mono dim-char">2</text><text x="0" y="28" class="mono mid-char">0</text><text x="0" y="42" class="mono mid-char">x</text><text x="0" y="56" class="mono lead-char">7</text><text x="0" y="70" class="mono head-char">F</text>
    </g>
    <!-- Column 17 -->
    <g class="c17" transform="translate(414, 0)">
      <text x="0" y="0" class="mono dark-char">ﾎ</text><text x="0" y="14" class="mono dim-char">ﾏ</text><text x="0" y="28" class="mono mid-char">ﾐ</text><text x="0" y="42" class="mono mid-char">ﾑ</text><text x="0" y="56" class="mono lead-char">ﾒ</text><text x="0" y="70" class="mono head-char">ﾓ</text>
    </g>
    <!-- Column 18 -->
    <g class="c18" transform="translate(438, 0)">
      <text x="0" y="0" class="mono dark-char">A</text><text x="0" y="14" class="mono dim-char">E</text><text x="0" y="28" class="mono mid-char">S</text><text x="0" y="42" class="mono mid-char">2</text><text x="0" y="56" class="mono lead-char">5</text><text x="0" y="70" class="mono head-char">6</text>
    </g>
    <!-- Column 19 -->
    <g class="c19" transform="translate(462, 0)">
      <text x="0" y="0" class="mono dark-char">1</text><text x="0" y="14" class="mono dim-char">0</text><text x="0" y="28" class="mono mid-char">1</text><text x="0" y="42" class="mono mid-char">0</text><text x="0" y="56" class="mono lead-char">1</text><text x="0" y="70" class="mono head-char">0</text>
    </g>
  </g>

  <!-- RIGHT PANE: Holographic Radar & Netrunner Command Center -->
  <g transform="translate(510, 34)">
    <rect x="0" y="0" width="375" height="192" rx="4" fill="#040813" stroke="#1E293B" stroke-width="1" />

    <!-- Section Title -->
    <text x="14" y="18" class="mono" font-size="9.5" font-weight="bold" fill="#00F5D4" letter-spacing="1.2">// HOLOGRAPHIC TACTICAL RADAR [LOCK: CYBPARAM]</text>
    <line x1="14" y1="24" x2="360" y2="24" stroke="#1E293B" stroke-width="0.8" />

    <!-- Circular Radar -->
    <g transform="translate(90, 105)" class="reticle-pulse">
      <circle cx="0" cy="0" r="58" fill="#020610" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="0" cy="0" r="42" fill="none" stroke="#00F5D4" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />
      <circle cx="0" cy="0" r="24" fill="none" stroke="#FF007F" stroke-width="0.8" opacity="0.5" />
      <circle cx="0" cy="0" r="6" fill="#00F5D4" />

      <!-- Crosshairs -->
      <line x1="-64" y1="0" x2="64" y2="0" stroke="#00F5D4" stroke-width="0.8" opacity="0.4" />
      <line x1="0" y1="-64" x2="0" y2="64" stroke="#00F5D4" stroke-width="0.8" opacity="0.4" />

      <!-- Spinning Radar Beam -->
      <g class="radar-rot">
        <path d="M 0 0 L 58 -22 A 58 58 0 0 1 58 0 Z" fill="url(#radar-beam)" />
        <line x1="0" y1="0" x2="58" y2="0" stroke="#00F5D4" stroke-width="1.5" />
      </g>

      <!-- Target Lock Blip -->
      <circle cx="26" cy="-18" r="3" fill="#00FF66" class="blink-fast" filter="url(#bloom-green)" />
      <text x="32" y="-16" class="mono" font-size="7.5" fill="#00FF66" font-weight="bold">TARGET_0x7F</text>
    </g>

    <!-- Telemetry Readouts Next to Radar -->
    <g transform="translate(170, 36)">
      <!-- Line 1: Target Lock -->
      <text x="0" y="14" class="mono" font-size="9" fill="#64748B">TARGET_NODE</text>
      <text x="100" y="14" class="mono" font-size="9.5" fill="#00F5D4" font-weight="bold">cybparam // ROOT</text>

      <!-- Line 2: Neural Frequency -->
      <text x="0" y="32" class="mono" font-size="9" fill="#64748B">SYNAPSE_FREQ</text>
      <text x="100" y="32" class="mono" font-size="9.5" fill="#FF007F" font-weight="bold">5.82 GHz [SYNC]</text>

      <!-- Line 3: Encryption -->
      <text x="0" y="50" class="mono" font-size="9" fill="#64748B">CIPHER_TUNNEL</text>
      <text x="100" y="50" class="mono" font-size="9.5" fill="#00FF66" font-weight="bold">AES-GCM-4096</text>

      <!-- Line 4: Intrusion Status -->
      <text x="0" y="68" class="mono" font-size="9" fill="#64748B">STEALTH_RATING</text>
      <text x="100" y="68" class="mono" font-size="9.5" fill="#00BBF9" font-weight="bold">100% UNTRACEABLE</text>

      <!-- Line 5: Active Stream -->
      <text x="0" y="86" class="mono" font-size="9" fill="#64748B">BANDWIDTH_BUS</text>
      <text x="100" y="86" class="mono" font-size="9.5" fill="#E2E8F0">3.44 TB/s</text>
    </g>

    <!-- Oscilloscope Brainwave Bar at Bottom -->
    <g transform="translate(14, 150)">
      <rect x="0" y="0" width="346" height="30" rx="3" fill="#02050c" stroke="#1E293B" stroke-width="0.8" />
      <text x="8" y="18" class="mono" font-size="8" fill="#64748B">OSC // WAVE</text>
      
      <!-- Pulsing Waveform -->
      <g class="wave-pulse" transform="translate(85, 0)">
        <path d="M 0 15 Q 12 3, 24 15 T 48 15 T 72 26 T 96 15 T 120 4 T 144 15 T 168 25 T 192 15 T 216 6 T 240 15" 
              fill="none" stroke="#00F5D4" stroke-width="1.6" filter="url(#bloom-head)" />
      </g>

      <circle cx="334" cy="15" r="3" fill="#00FF66" class="blink-fast" />
    </g>
  </g>
</svg>
