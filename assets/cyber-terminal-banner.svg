<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00BBF9" />
    </linearGradient>

    <!-- Neon Pink/Magenta Gradient -->
    <linearGradient id="pink-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00F5D4" stroke-opacity="0.04" stroke-width="1.5" />
    </pattern>

    <!-- Cyber Grid Pattern -->
    <pattern id="cybergrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00F5D4" stroke-opacity="0.05" stroke-width="0.8" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Courier, monospace; }
    .scan-beam {
      animation: scan 4s linear infinite;
    }
    @keyframes scan {
      0% { transform: translateY(0px); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateY(240px); opacity: 0; }
    }

    .radar-sweep {
      transform-origin: 760px 120px;
      animation: sweep 6s linear infinite;
    }
    @keyframes sweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .radar-blip {
      animation: blip 2s ease-in-out infinite alternate;
    }
    @keyframes blip {
      0% { opacity: 0.2; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.1); }
    }

    .cursor-blink {
      animation: blink 0.9s infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .bar-1 { animation: eq1 1.2s ease-in-out infinite alternate; }
    .bar-2 { animation: eq2 0.9s ease-in-out infinite alternate; }
    .bar-3 { animation: eq3 1.4s ease-in-out infinite alternate; }
    .bar-4 { animation: eq4 0.8s ease-in-out infinite alternate; }
    .bar-5 { animation: eq5 1.1s ease-in-out infinite alternate; }
    .bar-6 { animation: eq6 1.3s ease-in-out infinite alternate; }

    @keyframes eq1 { 0% { height: 6px; } 100% { height: 26px; } }
    @keyframes eq2 { 0% { height: 22px; } 100% { height: 8px; } }
    @keyframes eq3 { 0% { height: 10px; } 100% { height: 30px; } }
    @keyframes eq4 { 0% { height: 28px; } 100% { height: 12px; } }
    @keyframes eq5 { 0% { height: 8px; } 100% { height: 24px; } }
    @keyframes eq6 { 0% { height: 20px; } 100% { height: 10px; } }

    .glow-cyan { fill: #00F5D4; filter: drop-shadow(0 0 4px #00F5D4); }
    .glow-pink { fill: #FF007F; filter: drop-shadow(0 0 4px #FF007F); }
    .text-dim { fill: #64748B; }
  </style>

  <!-- Frame Background -->
  <rect x="2" y="2" width="896" height="236" rx="8" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="1.5" />
  <rect x="2" y="2" width="896" height="236" rx="8" fill="url(#cybergrid)" />
  <rect x="2" y="2" width="896" height="236" rx="8" fill="url(#scanlines)" />

  <!-- Animated CRT Scanline Beam -->
  <g class="scan-beam">
    <line x1="2" y1="0" x2="898" y2="0" stroke="#00F5D4" stroke-width="1.5" opacity="0.6" filter="url(#neon-glow)" />
    <rect x="2" y="-12" width="896" height="12" fill="url(#cyan-glow)" opacity="0.06" />
  </g>

  <!-- Outer Neon Accents -->
  <path d="M 2 30 L 2 10 L 25 10" fill="none" stroke="#00F5D4" stroke-width="2.5" />
  <path d="M 898 30 L 898 10 L 875 10" fill="none" stroke="#FF007F" stroke-width="2.5" />
  <path d="M 2 210 L 2 230 L 25 230" fill="none" stroke="#FF007F" stroke-width="2.5" />
  <path d="M 898 210 L 898 230 L 875 230" fill="none" stroke="#00F5D4" stroke-width="2.5" />

  <!-- Terminal Top Bar -->
  <rect x="3" y="3" width="894" height="28" rx="6" fill="#070c18" stroke="#1e293b" stroke-width="0.8" />
  
  <!-- Window Control Dots -->
  <circle cx="22" cy="17" r="4.5" fill="#FF5F56" />
  <circle cx="37" cy="17" r="4.5" fill="#FFBD2E" />
  <circle cx="52" cy="17" r="4.5" fill="#27C93F" />

  <!-- Terminal Header Title -->
  <text x="75" y="21" class="mono" font-size="11" font-weight="bold" fill="#00F5D4" letter-spacing="1.5">CYBPARAM // NEURAL-TERMINAL v4.09 [AUTH: ROOT]</text>

  <!-- Top Right Telemetry -->
  <text x="880" y="21" text-anchor="end" class="mono" font-size="10" fill="#64748B" letter-spacing="1">LINK: 100% | LATENCY: 9ms | NODE: 0x7F-PRM</text>

  <!-- Left Content: Prompt & Identity -->
  <g transform="translate(30, 48)">
    <!-- Terminal Command Line -->
    <text x="0" y="22" class="mono" font-size="12" fill="#64748B">&gt; root@netrunner:~$</text>
    <text x="145" y="22" class="mono" font-size="12" font-weight="bold" fill="#00FF66">./initiate_profile.sh --target cybparam</text>

    <!-- Main Handle Display -->
    <g transform="translate(0, 44)">
      <text x="0" y="32" class="mono glow-cyan" font-size="34" font-weight="900" letter-spacing="3">CYBPARAM</text>
      <text x="215" y="28" class="mono glow-pink" font-size="14" font-weight="bold" letter-spacing="2">[NODE_ONLINE]</text>
    </g>

    <!-- Subtitle / Role -->
    <text x="0" y="105" class="mono" font-size="13" fill="#E2E8F0" letter-spacing="1">
      <tspan fill="#FF007F" font-weight="bold">&gt;&gt; </tspan>
      <tspan fill="#00F5D4">SYSTEM ROLE :</tspan>
      <tspan fill="#CBD5E1"> Autonomous AI Architect &amp; Systems Builder</tspan>
    </text>

    <!-- Directive / Method -->
    <text x="0" y="128" class="mono" font-size="12" fill="#94A3B8" letter-spacing="0.5">
      <tspan fill="#00F5D4">&gt;&gt; </tspan>
      <tspan fill="#E2E8F0">DIRECTIVE   :</tspan>
      <tspan fill="#94A3B8"> Decompile the impossible. Learn &gt; Build &gt; Ship.</tspan>
      <tspan class="cursor-blink" fill="#00F5D4" font-weight="bold"> █</tspan>
    </text>

    <!-- Badges / Status Chips -->
    <g transform="translate(0, 146)">
      <!-- Badge 1: Neural Status -->
      <rect x="0" y="0" width="130" height="20" rx="3" fill="#0c172e" stroke="#00F5D4" stroke-width="0.8" />
      <circle cx="10" cy="10" r="3" fill="#00FF66" class="radar-blip" />
      <text x="20" y="14" class="mono" font-size="9.5" fill="#00F5D4" font-weight="bold">NEURAL_LINK: OK</text>

      <!-- Badge 2: Clearance -->
      <rect x="140" y="0" width="135" height="20" rx="3" fill="#240e24" stroke="#FF007F" stroke-width="0.8" />
      <circle cx="150" cy="10" r="3" fill="#FF007F" class="radar-blip" />
      <text x="160" y="14" class="mono" font-size="9.5" fill="#FF007F" font-weight="bold">CLEARANCE: LVL-5</text>

      <!-- Badge 3: Encryption -->
      <rect x="285" y="0" width="125" height="20" rx="3" fill="#0a1d24" stroke="#00BBF9" stroke-width="0.8" />
      <text x="295" y="14" class="mono" font-size="9.5" fill="#00BBF9" font-weight="bold">CIPHER: AES-GCM</text>
    </g>
  </g>

  <!-- Center-Right: Equalizer / Telemetry Waves -->
  <g transform="translate(560, 115)">
    <text x="0" y="0" class="mono" font-size="9" fill="#64748B" letter-spacing="1">AUDIO_DSP // SIGNAL</text>
    <!-- Equalizer bars -->
    <g transform="translate(0, 12)">
      <rect x="0" y="0" width="5" height="15" rx="1" fill="#00F5D4" class="bar-1" />
      <rect x="8" y="0" width="5" height="18" rx="1" fill="#00F5D4" class="bar-2" />
      <rect x="16" y="0" width="5" height="22" rx="1" fill="#00BBF9" class="bar-3" />
      <rect x="24" y="0" width="5" height="12" rx="1" fill="#00BBF9" class="bar-4" />
      <rect x="32" y="0" width="5" height="25" rx="1" fill="#FF007F" class="bar-5" />
      <rect x="40" y="0" width="5" height="19" rx="1" fill="#FF007F" class="bar-6" />
      <rect x="48" y="0" width="5" height="14" rx="1" fill="#FF007F" class="bar-2" />
      <rect x="56" y="0" width="5" height="24" rx="1" fill="#00F5D4" class="bar-4" />
      <rect x="64" y="0" width="5" height="16" rx="1" fill="#00F5D4" class="bar-1" />
      <rect x="72" y="0" width="5" height="20" rx="1" fill="#00BBF9" class="bar-3" />
      <rect x="80" y="0" width="5" height="11" rx="1" fill="#00BBF9" class="bar-5" />
      <rect x="88" y="0" width="5" height="27" rx="1" fill="#00FF66" class="bar-2" />
    </g>
    <text x="0" y="58" class="mono" font-size="9" fill="#00F5D4">STREAM: 98.4 KB/s</text>
    <text x="0" y="70" class="mono" font-size="9" fill="#64748B">PACKETS: 142,890 OK</text>
  </g>

  <!-- Far-Right: Cyber Radar & HUD Rings -->
  <g transform="translate(760, 130)">
    <!-- Radar Rings -->
    <circle cx="0" cy="0" r="65" fill="#040b18" stroke="#1E293B" stroke-width="1" />
    <circle cx="0" cy="0" r="48" fill="none" stroke="#00F5D4" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.6" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="#FF007F" stroke-width="0.8" opacity="0.5" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#00F5D4" stroke-width="1.2" />

    <!-- Crosshair axes -->
    <line x1="-72" y1="0" x2="72" y2="0" stroke="#00F5D4" stroke-width="0.7" opacity="0.4" />
    <line x1="0" y1="-72" x2="0" y2="72" stroke="#00F5D4" stroke-width="0.7" opacity="0.4" />

    <!-- Radar Sweep Beam -->
    <g class="radar-sweep">
      <path d="M 0 0 L 65 -20 A 65 65 0 0 1 65 0 Z" fill="url(#cyan-glow)" opacity="0.3" />
      <line x1="0" y1="0" x2="65" y2="0" stroke="#00F5D4" stroke-width="1.5" />
    </g>

    <!-- Blip targets -->
    <circle cx="28" cy="-22" r="3" fill="#00FF66" class="radar-blip" filter="url(#neon-glow)" />
    <text x="34" y="-20" class="mono" font-size="8" fill="#00FF66">TARGET_01</text>
    
    <circle cx="-25" cy="32" r="2.5" fill="#FF007F" class="radar-blip" filter="url(#neon-glow)" />
    <text x="-65" y="44" class="mono" font-size="8" fill="#FF007F">AI_CORE</text>

    <!-- Reticle corner brackets -->
    <path d="M -55 -40 L -65 -40 L -65 -30" fill="none" stroke="#00F5D4" stroke-width="1.2" />
    <path d="M 55 -40 L 65 -40 L 65 -30" fill="none" stroke="#00F5D4" stroke-width="1.2" />
    <path d="M -55 40 L -65 40 L -65 30" fill="none" stroke="#00F5D4" stroke-width="1.2" />
    <path d="M 55 40 L 65 40 L 65 30" fill="none" stroke="#00F5D4" stroke-width="1.2" />

    <!-- Radar Label -->
    <text x="0" y="78" text-anchor="middle" class="mono" font-size="8.5" fill="#00F5D4" letter-spacing="1">RADAR // ACTIVE SCAN</text>
  </g>
</svg>
